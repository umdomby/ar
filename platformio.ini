[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM10         ; ← поменяйте на свой порт
monitor_port = COM10

lib_deps =
    https://github.com/Links2004/arduinoWebSockets.git
    arminjo/ServoEasing@^2.4.0
    ESP32Servo@^1.0.3